# Base de datos local: PostgreSQL 16 + PostGIS.
#   docker compose up -d db
# Luego, desde backend/: alembic upgrade head && python -m app.seed
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: facfood
      POSTGRES_PASSWORD: facfood
      POSTGRES_DB: facfood
    ports:
      - "5432:5432"
    volumes:
      - datos-facfood:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facfood"]
      interval: 5s
      retries: 10

volumes:
  datos-facfood:
